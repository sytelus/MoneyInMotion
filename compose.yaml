services:
  moneyinmotion:
    build: .
    restart: unless-stopped
    environment:
      MIM_DATA_ROOT: /data
      MIM_USERNAME: ${MIM_USERNAME:-shitals}
      MIM_PORT: 3001
    ports:
      - "${MIM_PORT:-3001}:3001"
    volumes:
      - moneyinmotion-data:/data

volumes:
  moneyinmotion-data:
