name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: python3 --version
      - run: bash -n install.sh run.sh
      - run: ./run.sh --help
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Verify production-pruned installation
        run: ./install.sh && npm run smoke:production

  # Windows is the primary platform (run.bat); keep it green alongside Linux.
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: run.bat --help
        shell: cmd
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke:production
      - run: npx playwright install chromium
      - run: npx playwright test
